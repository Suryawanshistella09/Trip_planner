<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destinations - AstraTrip</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="navbar-container">
            <a href="index.html" class="navbar-brand">🚀 AstraTrip</a>
            <ul class="navbar-nav">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="destinations.html" class="nav-link active">Destinations</a></li>
                <li><a href="planner.html" class="nav-link">Trip Planner</a></li>
                <li><a href="itinerary.html" class="nav-link">My Itinerary</a></li>
                <li><a href="packing.html" class="nav-link">Packing List</a></li>
                <li><a href="expenses.html" class="nav-link">Expenses</a></li>
                <li><a href="group-travel.html" class="nav-link">Group Travel</a></li>
                <li><a href="gamification.html" class="nav-link">🎮 Gamification</a></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="page-container">
        <!-- Page Header -->
        <div class="page-header">
            <h1 class="page-title">🌍 Explore Destinations</h1>
            <p class="page-subtitle">Discover amazing places around the world and find your next adventure destination.</p>
            <div class="page-actions">
                <button class="btn btn-primary" onclick="showGroupVoting()">
                    <i class="fas fa-users"></i> Group Vote on Destinations
                </button>
            </div>
        </div>

        <!-- Filter Section -->
        <div class="card mb-4">
            <div class="card-body">
                <div class="grid grid-3">
                    <div class="form-group">
                        <label for="continent-filter" class="form-label">Filter by Continent</label>
                        <select id="continent-filter" class="form-control">
                            <option value="">All Continents</option>
                            <option value="Europe">Europe</option>
                            <option value="Asia">Asia</option>
                            <option value="North America">North America</option>
                            <option value="South America">South America</option>
                            <option value="Africa">Africa</option>
                            <option value="Oceania">Oceania</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="preference-filter" class="form-label">Filter by Travel Style</label>
                        <select id="preference-filter" class="form-control">
                            <option value="">All Styles</option>
                            <option value="adventure">Adventure</option>
                            <option value="foodie">Foodie</option>
                            <option value="relaxation">Relaxation</option>
                            <option value="culture">Culture</option>
                            <option value="shopping">Shopping</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="search-filter" class="form-label">Search Destinations</label>
                        <input type="text" id="search-filter" class="form-control" placeholder="Search by name...">
                    </div>
                </div>
            </div>
        </div>

        <!-- Destinations Grid -->
        <div class="grid grid-3" id="destinations-grid">
            <!-- Destinations will be loaded here -->
        </div>

        <!-- Load More Button -->
        <div class="text-center mt-4">
            <button id="load-more" class="btn btn-outline">Load More Destinations</button>
        </div>
    </div>

    <!-- Destination Modal -->
    <div id="destination-modal" class="d-none" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; display: flex; align-items: center; justify-content: center;">
        <div class="card" style="max-width: 800px; max-height: 90vh; overflow-y: auto;">
            <div class="card-header">
                <h2 id="modal-title" class="card-title"></h2>
            </div>
            <div class="card-body">
                <div id="modal-content">
                    <!-- Modal content will be loaded here -->
                </div>
            </div>
            <div class="card-footer">
                <button id="close-modal" class="btn btn-secondary">Close</button>
                <button id="plan-trip" class="btn btn-primary">Plan Trip to This Destination</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="cities-data.js"></script>
    <script src="gamification.js"></script>
    <script src="destinations.js"></script>
    <script src="group-travel.js"></script>
    <script src="enhancements.js"></script>
    
    <script>
        function showGroupVoting() {
            // Create a modal for group voting
            const modal = document.createElement('div');
            modal.className = 'modal-overlay';
            modal.innerHTML = `
                <div class="modal-content" style="max-width: 800px;">
                    <div class="modal-header">
                        <h3>🗳️ Group Vote on Destinations</h3>
                        <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">×</button>
                    </div>
                    <div class="modal-body">
                        <div id="group-voting-container">
                            <!-- Group voting interface will be rendered here -->
                        </div>
                    </div>
                </div>
            `;
            
            document.body.appendChild(modal);
            
            // Initialize group voting for destinations
            if (window.groupTravel) {
                groupTravel.renderVotingInterface();
                groupTravel.updateRecommendations();
            }
        }
    </script>
</body>
</html>
